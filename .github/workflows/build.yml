name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          curl -O https://sourceforge.net/projects/sbcl/files/sbcl/2.5.3/sbcl-2.5.3-x86-64-linux-binary.tar.bz2
          bzip2 -cd sbcl-2.5.3-x86-linux-binary.tar.bz2 | tar xvf -
          cd sbcl-2.5.3-x86-linux
          sudo sh install.sh
      - run: make save
      - uses: actions/upload-artifact@v4
        with:
          name: pgloader-${{ matrix.os }}
          path: build/bin
