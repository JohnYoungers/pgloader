name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl unzip libsqlite3-dev gawk curl make freetds-dev libzip-dev
      - run: make save
      - uses: actions/upload-artifact@v4
        with:
          name: pgloader-${{ matrix.os }}
          path: build/bin
